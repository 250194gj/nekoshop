<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NekoShop | ファッションストア</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          th:href="@{/css/style.css}"></head>
<!-- navibar--<----------------------------------------------------------------------------->
<nav  th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/home}">
            NekoShop
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        商品一覧
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/staff/products/new}">
                        商品追加
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>
<!----------------------------------------------------------------------------->

<body>


<main class="container py-4 py-md-5">

    <section class="hero mb-5">
        <p class="text-uppercase text-secondary mb-2">
            Everyday Fashion
        </p>

        <h1 class="fw-bold">お気に入りを見つけよう。</h1>

        <p class="mb-0 text-secondary">
            毎日のコーディネートをもっと楽しく。
        </p>
    </section>

    <!-- タイトル -->
    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">商品一覧</h2>
            <p class="text-secondary mb-0">
                お気に入りのアイテムを見つけましょう。
            </p>
        </div>

        <span class="badge text-bg-dark" th:text="|${#lists.size(products)} items|">
            0 items
        </span>
    </div>

    <!-- 商品一覧表 -->
    <div class="row g-3 g-md-4">

        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">

            <article class="card product-card shadow-sm">

                <img th:src="@{${product.image}}"
                     th:alt="${product.name}"
                     class="product-image"
                     loading="lazy">

                <div class="card-body d-flex flex-column">

                    <h3 class="product-name mb-2" th:text="${product.name}">
                        商品名
                    </h3>

                    <p class="product-description mb-3" th:text="${product.description}">
                        商品説明
                    </p>

                    <p class="product-price mb-3" th:text="|¥${product.price}|">
                        ¥0
                    </p>

                    <a th:href="@{/products/{id}(id = ${product.id})}"
                       class="btn btn-outline-dark mt-auto">
                        詳細を見る
                    </a>
                    <a th:href="@{/staff/products/delete/{id}(id = ${product.id})}"
                       class="btn btn-outline-dark mt-auto">
                        削除
                    </a>

                </div>
            </article>

        </div>

    </div>

    <!-- 商品なし場合 -->
    <div class="text-center py-5" th:if="${#lists.isEmpty(products)}">
        <h3>商品がありません。</h3>
        <p class="text-secondary">
            現在、表示できる商品はありません。
        </p>
    </div>

</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small>&copy; NekoShop — Fashion for everyday.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
