<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NekoShop | ファッションストア</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f8f8;
            color: #222;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
        }

        .hero {
            background: #eae5df;
            padding: 48px 24px;
            border-radius: 12px;
        }

        .product-card {
            height: 100%;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
        }

        .product-image {
            width: 100%;
            height: 260px;
            object-fit: contain;
            background-color: #fff;
            padding: 12px;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #b42318;
        }

        .product-description {
            color: #777;
            font-size: 0.875rem;
        }

        @media (max-width: 576px) {
            .product-image {
                height: 180px;
            }

            .hero {
                padding: 28px 18px;
            }
        }
    </style>
</head>

<body>

<!-- navibar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand"
           th:href="@{/}">
            NekoShop
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/}">
                        商品一覧
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<article class="card product-card shadow-sm">

    <img th:src="@{${product.image}}"
         th:alt="${product.name}"
         class="product-image"
         loading="lazy">

    <div class="card-body d-flex flex-column">

        <h3 class="product-name mb-2" th:text="${product.name}">
            商品名
        </h3>

        <p class="product-description mb-3" th:text="${product.description}">
            商品説明
        </p>

        <p class="product-price mb-3" th:text="|¥${product.price}|">
            ¥0
        </p>
<div class="d-flex justify-content-center gap-2">

        <a th:href="@{/products/{id}(id = ${product.id})}"
           class="btn btn-outline-dark mt-auto">
            カートに入れる
        </a>
        <a th:href="@{/products/{id}(id = ${product.id})}"
           class="btn btn-outline-dark mt-auto" >
           すぐ買う
        </a>
    </div>
    </div>
</article>


<footer class="bg-dark text-white text-center py-4 mt-5">
    <small>&copy; NekoShop — Fashion for everyday.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
