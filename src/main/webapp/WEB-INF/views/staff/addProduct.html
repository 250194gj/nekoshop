<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品を追加 | NekoShop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<main class="container py-5">
  <h1 class="mb-4">商品を追加</h1>

  <form th:action="@{/staff/product/add}"
        th:object="${product}"
        method="post">

    <div class="mb-3">
      <label for="name" class="form-label">商品名</label>
      <input id="name" type="text" class="form-control"
             th:field="*{name}" required>
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">価格</label>
      <input id="price" type="number" class="form-control"
             th:field="*{price}" min="0" step="1" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">商品説明</label>
      <textarea id="description" class="form-control" rows="4"
                th:field="*{description}"></textarea>
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">画像パス</label>
      <input id="image" type="text" class="form-control"
             th:field="*{image}"
             placeholder="/images/products/shirt.jpg">
    </div>

    <button type="submit" class="btn btn-dark">保存する</button>
    <a th:href="@{/home}" class="btn btn-outline-secondary">戻る</a>
  </form>
</main>
</body>
</html>
